<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المسابقة</title>
  <!-- خط Tajawal من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ═══ إعدادات عامة (من تصميمك) ═══ */
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Tajawal', sans-serif;
    }

    * { box-sizing: border-box; }

    /* ═══ قسم اللعبة الرئيسي ═══ */
    #section-game {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 2400px;
      background-color: #29405b;
      box-shadow: 0px 4px 4px 0px rgba(0, 0, 0, 0.25);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 24px;
      padding: 24px;
      background-color: #29405b;
      box-shadow: 6px 4px 4px 0px rgba(0, 0, 0, 0.25);
      z-index: 2;
      position: relative;
    }

    .category {
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: -10px 4px 4px 0px rgba(0, 0, 0, 0.25);
    }

    .title {
      background-color: #eb9c72;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 131px;
      font-size: 40px;
      font-weight: 700;
      box-shadow: inset -12px 13px 4px 0px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .tiles { display: flex; flex-direction: column; gap: 8px; }

    .tile {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 162.6px;
      color: #e9f3ee;
      font-size: 80px;
      font-weight: 700;
      box-shadow: inset 15px -15px 4px 0px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.3s ease;
      user-select: none;
    }

    .tile:active { transform: scale(0.98); }

    .tile-200 { background-color: #edb99d; }
    .tile-400 { background-color: #eaac8b; }
    .tile-600 { background-color: #ea9e8d; }
    .tile-800 { background-color: #eb7e66; }
    .tile-1000 { background-color: #ef233c; }

    /* بلاطة تمت الإجابة عليها */
    .tile.answered { opacity: 0.3; pointer-events: none; }

    .points-section {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 24px;
      background-color: #29405b;
      box-shadow: inset -23px 18px 4px 0px rgba(0, 0, 0, 0.25);
      margin-top: -36px;
      z-index: 1;
      position: relative;
    }

    .team {
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: outline 0.2s;
      border-radius: 16px;
      cursor: pointer;
    }

    .team.active-team {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    .team-actions { display: flex; flex-direction: row; gap: 8px; height: 77px; }

    .btn-subtract, .btn-add {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 32px;
      font-weight: 700;
      border: 2px solid #e9f3ee;
      border-radius: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-subtract:hover, .btn-add:hover { opacity: 0.9; }

    .btn-subtract { background-color: #eb7e66; }
    .btn-add { background-color: #eaac8b; }

    .team-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 167px;
      padding: 20px;
      box-shadow: inset -10px 11px 4px 0px rgba(0, 0, 0, 0.25);
    }

    .team-red { background-color: #f57979; }
    .team-orange { background-color: #f3933f; }
    .team-green { background-color: #88e888; }
    .team-blue { background-color: #98a8f5; }

    .team-score {
      color: #ffffff;
      font-size: 80px;
      font-weight: 700;
      line-height: 1;
    }

    .team-name {
      color: #29405b;
      font-size: 32px;
      font-weight: 700;
      align-self: flex-end;
    }

    /* ═══ المودال (نافذة السؤال) ═══ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-content {
      background: #2d4b6e;
      color: #fff;
      border-radius: 24px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      animation: scaleIn 0.2s ease;
    }
    @keyframes scaleIn { from { transform: scale(0.8); } to { transform: scale(1); } }

    .modal-content h2 { margin: 0 0 10px; font-size: 32px; }
    .modal-question { font-size: 28px; margin: 20px 0; line-height: 1.5; }
    .modal-answer-label { color: #f59e0b; font-size: 20px; }
    .modal-answer-text { font-size: 32px; font-weight: 700; margin: 10px 0 20px; }
    .modal-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-correct, .btn-wrong, .btn-close-modal {
      border: none; padding: 12px 24px; border-radius: 12px;
      font-size: 20px; font-weight: 700; cursor: pointer;
      transition: filter 0.2s; color: white;
    }
    .btn-correct { background: #4caf50; }
    .btn-wrong { background: #f44336; }
    .btn-close-modal { background: #666; }
    .btn-correct:hover, .btn-wrong:hover { filter: brightness(1.1); }

    /* ═══ مؤشر الفريق الحالي (أعلى اللوحة) ═══ */
    .game-header {
      display: flex; justify-content: space-between; align-items: center;
      color: #eb9c72; margin-bottom: 15px; font-size: 24px; font-weight: 700;
      padding: 0 24px;
    }
    .btn-reset, .btn-results {
      background: #eb9c72; border: none; color: #1a1a1a;
      padding: 10px 20px; border-radius: 12px; font-weight: 700;
      font-size: 18px; cursor: pointer; margin-left: 10px;
    }

    /* Responsive Design – من Figma */
    @media (max-width: 1600px) {
      .title { font-size: 32px; height: 100px; }
      .tile { font-size: 64px; height: 130px; }
      .team-score { font-size: 64px; }
      .team-name { font-size: 24px; }
      .btn-subtract, .btn-add { font-size: 24px; height: 60px; }
      .team-actions { height: 60px; }
      .team-info { height: 140px; }
    }
    @media (max-width: 1200px) {
      .title { font-size: 24px; height: 80px; }
      .tile { font-size: 48px; height: 100px; }
      .btn-subtract, .btn-add { font-size: 20px; height: 50px; }
      .team-actions { height: 50px; }
      .team-info { height: 120px; padding: 12px; }
      .team-score { font-size: 48px; }
      .team-name { font-size: 20px; }
      .board { gap: 16px; padding: 16px; }
      .points-section { padding: 16px; gap: 8px; }
    }
    @media (max-width: 992px) {
      .board { grid-template-columns: repeat(3, 1fr); }
      .points-section { grid-template-columns: repeat(2, 1fr); margin-top: 0; }
    }
    @media (max-width: 576px) {
      .board { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
      .points-section { grid-template-columns: 1fr; padding: 12px; }
      .title { font-size: 20px; height: 60px; }
      .tile { font-size: 36px; height: 80px; }
    }
  </style>
</head>
<body>

<section id="section-game">
  <!-- شريط علوي بسيط للدور الحالي وأزرار التحكم -->
  <div style="width:100%; max-width:2400px;">
    <div class="game-header">
      <span id="teamIndicator">الدور: الفريق الأحمر</span>
      <div>
        <button class="btn-results" onclick="showResults()">📊 النتائج</button>
        <button class="btn-reset" onclick="resetGame()">🔄 إعادة ضبط</button>
      </div>
    </div>
  </div>

  <div class="game-container">
    <!-- لوحة الأسئلة -->
    <div class="board" id="boardContainer">
      <!-- سيتم بناؤها ديناميكيًا عبر JavaScript -->
    </div>

    <!-- قسم الفرق والنقاط -->
    <div class="points-section" id="teamsContainer">
      <!-- سيتم بناؤها ديناميكيًا عبر JavaScript -->
    </div>
  </div>
</section>

<!-- ملفات البيانات والمنطق -->
<script src="questions-data.js"></script>
<script src="game.js"></script>

<script>
  // ═══ تعريف الفرق ═══
  const TEAMS = [
    { id: 'red',    name: 'الفريق الأحمر',     css: 'team-red' },
    { id: 'orange', name: 'الفريق البرتقالي',   css: 'team-orange' },
    { id: 'green',  name: 'الفريق الأخضر',      css: 'team-green' },
    { id: 'blue',   name: 'الفريق الأزرق',      css: 'team-blue' }
  ];

  // ═══ بناء اللوحة من ملف البيانات ═══
  function buildBoard() {
    const board = document.getElementById('boardContainer');
    board.innerHTML = '';
    QUIZ_DATA.forEach(cat => {
      const catDiv = document.createElement('div');
      catDiv.className = 'category';
      catDiv.innerHTML = `<div class="title">${cat.category}</div><div class="tiles" id="tiles-${cat.base}"></div>`;
      board.appendChild(catDiv);
      const tilesDiv = catDiv.querySelector('.tiles');
      cat.questions.forEach(q => {
        const tile = document.createElement('div');
        tile.className = `tile tile-${q.points}`;
        tile.textContent = q.points;
        tile.addEventListener('click', () => openQuestionModal(cat, q));
        const key = `answered_${cat.base}_${q.points}`;
        if (localStorage.getItem(key) === 'true') tile.classList.add('answered');
        tilesDiv.appendChild(tile);
      });
    });
  }

  // ═══ بناء قسم الفرق ═══
  function buildTeams() {
    const container = document.getElementById('teamsContainer');
    container.innerHTML = '';
    TEAMS.forEach(team => {
      const teamDiv = document.createElement('div');
      teamDiv.className = 'team';
      teamDiv.dataset.team = team.id;
      if (getCurrentTeam() === team.id) teamDiv.classList.add('active-team');

      teamDiv.innerHTML = `
        <div class="team-actions">
          <button class="btn-subtract" id="sub-${team.id}">-200</button>
          <button class="btn-add" id="add-${team.id}">+200</button>
        </div>
        <div class="team-info ${team.css}">
          <div class="team-score" id="score-${team.id}">${getTeamScore(team.id)}</div>
          <div class="team-name">${team.name}</div>
        </div>
      `;

      // أحداث الأزرار اليدوية
      teamDiv.querySelector('.btn-subtract').addEventListener('click', (e) => {
        e.stopPropagation();
        adjustScore(team.id, -200);
      });
      teamDiv.querySelector('.btn-add').addEventListener('click', (e) => {
        e.stopPropagation();
        adjustScore(team.id, 200);
      });

      // تغيير الفريق النشط
      teamDiv.addEventListener('click', () => {
        setActiveTeam(team.id);
        updateActiveTeamVisual();
      });

      container.appendChild(teamDiv);
    });
  }

  // ═══ تعديل النقاط وتحديثها ═══
  function adjustScore(teamId, amount) {
    let score = getTeamScore(teamId);
    score += amount;
    localStorage.setItem('score_' + teamId, score);
    const scoreEl = document.getElementById('score-' + teamId);
    if (scoreEl) scoreEl.textContent = score;
  }

  // ═══ إدارة الفريق النشط ═══
  function setActiveTeam(teamId) {
    setCurrentTeam(teamId);
    const indicator = document.getElementById('teamIndicator');
    const team = TEAMS.find(t => t.id === teamId);
    if (indicator) indicator.textContent = `الدور: ${team ? team.name : teamId}`;
  }

  function updateActiveTeamVisual() {
    const current = getCurrentTeam();
    document.querySelectorAll('.team').forEach(t => {
      t.classList.toggle('active-team', t.dataset.team === current);
    });
  }

  // ═══ نافذة السؤال (مودال) ═══
  function openQuestionModal(cat, question) {
    // إزالة أي مودال سابق
    const oldModal = document.querySelector('.modal-overlay');
    if (oldModal) oldModal.remove();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-content">
        <h2>${cat.category} – ${question.points} نقطة</h2>
        <div class="modal-question">${question.question}</div>
        <div class="modal-answer-label">🔑 الإجابة الصحيحة</div>
        <div class="modal-answer-text">${question.answer}</div>
        <div class="modal-buttons">
          <button class="btn-close-modal">إغلاق بدون تأثير</button>
          <button class="btn-wrong">❌ إجابة خاطئة (-${question.points})</button>
          <button class="btn-correct">✅ إجابة صحيحة (+${question.points})</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // أحداث الأزرار
    overlay.querySelector('.btn-correct').addEventListener('click', () => {
      adjustScore(getCurrentTeam(), question.points);
      finalizeQuestion(cat.base, question.points);
    });
    overlay.querySelector('.btn-wrong').addEventListener('click', () => {
      adjustScore(getCurrentTeam(), -question.points);
      finalizeQuestion(cat.base, question.points);
    });
    overlay.querySelector('.btn-close-modal').addEventListener('click', () => {
      overlay.remove();
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

  function finalizeQuestion(base, points) {
    localStorage.setItem(`answered_${base}_${points}`, 'true');
    nextTeam(); // انتقال تلقائي للفريق التالي
    // إعادة بناء اللوحة لتحديث البلاطات المجاب عليها
    buildBoard();
    // تحديث مظهر الفريق النشط
    updateActiveTeamVisual();
    setActiveTeam(getCurrentTeam());
    // إزالة المودال
    const modal = document.querySelector('.modal-overlay');
    if (modal) modal.remove();
  }

  // ═══ النتائج ═══
  function showResults() {
    const data = TEAMS.map(t => ({ name: t.name, score: getTeamScore(t.id) }))
                     .sort((a, b) => b.score - a.score);
    let message = '📊 النتائج النهائية:\n\n';
    data.forEach((item, idx) => {
      message += `${idx+1}. ${item.name} – ${item.score} نقطة\n`;
    });
    alert(message);
  }

  function resetGame() {
    if (confirm('هل أنت متأكد من إعادة ضبط كل النقاط والأسئلة؟')) {
      TEAMS.forEach(t => localStorage.removeItem('score_' + t.id));
      QUIZ_DATA.forEach(cat => cat.questions.forEach(q => localStorage.removeItem(`answered_${cat.base}_${q.points}`)));
      setCurrentTeam('red');
      location.reload();
    }
  }

  // ═══ بدء التشغيل ═══
  window.onload = () => {
    buildBoard();
    buildTeams();
    setActiveTeam(getCurrentTeam());
    updateActiveTeamVisual();
  };

  // تحديث البيانات عند العودة للصفحة
  window.addEventListener('focus', () => {
    TEAMS.forEach(t => {
      const el = document.getElementById('score-' + t.id);
      if (el) el.textContent = getTeamScore(t.id);
    });
    buildBoard(); // إعادة بناء البلاطات
    setActiveTeam(getCurrentTeam());
    updateActiveTeamVisual();
  });
</script>

</body>
</html>
