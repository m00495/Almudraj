<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المسابقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* نفس التنسيقات السابقة */
        body { margin:0; background:#1a1a1a; font-family:'Tajawal',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        #section-game { width:100%; padding:20px; display:flex; flex-direction:column; align-items:center; }
        .game-header { display:flex; justify-content:space-between; width:100%; max-width:2400px; margin-bottom:10px; color:#eb9c72; flex-wrap:wrap; }
        .board { display:grid; grid-template-columns:repeat(6,1fr); gap:24px; padding:24px; background:#29405b; }
        .category { display:flex; flex-direction:column; gap:20px; }
        .title { background:#eb9c72; color:#fff; text-align:center; height:100px; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; }
        .tiles { display:flex; flex-direction:column; gap:8px; }
        .tile { display:flex; align-items:center; justify-content:center; height:130px; color:#e9f3ee; font-size:64px; font-weight:700; text-decoration:none; transition:opacity 0.3s; }
        .tile-200{background:#edb99d} .tile-400{background:#eaac8b} .tile-600{background:#ea9e8d} .tile-800{background:#eb7e66} .tile-1000{background:#ef233c}
        .tile.answered { opacity:0.3; pointer-events:none; }
        .points-section { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:24px; background:#29405b; margin-top:-36px; }
        .team { cursor:pointer; border-radius:16px; transition:outline 0.2s; }
        .team.active-team { outline:3px solid #fff; outline-offset:4px; }
        .team-info { display:flex; flex-direction:column; justify-content:space-between; padding:20px; height:140px; }
        .team-red{background:#f57979} .team-orange{background:#f3933f} .team-green{background:#88e888} .team-blue{background:#98a8f5}
        .team-score { color:#fff; font-size:64px; font-weight:700; }
        .team-name { color:#29405b; font-size:24px; font-weight:700; align-self:flex-end; }
        .btn { padding:12px 24px; border:none; border-radius:12px; font-size:24px; font-weight:700; cursor:pointer; color:white; }
        .btn-results { background:#eb9c72; } .btn-reset { background:#e74c3c; }
        @media (max-width: 992px) { .board { grid-template-columns:repeat(3,1fr); } .points-section { grid-template-columns:repeat(2,1fr); margin-top:0; } }
        @media (max-width: 576px) { .board { grid-template-columns:repeat(2,1fr); } .points-section { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div id="section-game">
    <div class="game-header">
        <h1>🏆 لوحة المسابقة</h1>
        <div>
            <span id="teamIndicator">الدور: الفريق الأحمر</span>
            <button class="btn btn-results" onclick="showResults()">📊 النتائج</button>
            <button class="btn btn-reset" onclick="resetGame()">🔄 إعادة ضبط</button>
        </div>
    </div>
    <div class="game-container" style="width:100%;max-width:2400px;">
        <div class="board" id="boardContainer"></div>
        <div class="points-section" id="teamsContainer"></div>
    </div>
</div>

<div id="section-results" style="display:none; background:#2d4b6e; border-radius:24px; padding:40px; max-width:800px; margin:20px auto; color:white; text-align:center;">
    <h2>📊 النتائج</h2>
    <ul id="resultsList" style="list-style:none; padding:0;"></ul>
    <button class="btn" style="background:#eb9c72;" onclick="hideResults()">🔙 عودة</button>
</div>

<!-- ترتيب الملفات مهم: data ثم game ثم السكريبت الخاص بالصفحة -->
<script src="questions-data.js"></script>
<script src="game.js"></script>
<script>
    const TEAMS = [
        { id:'red', name:'الفريق الأحمر', css:'team-red' },
        { id:'orange', name:'الفريق البرتقالي', css:'team-orange' },
        { id:'green', name:'الفريق الأخضر', css:'team-green' },
        { id:'blue', name:'الفريق الأزرق', css:'team-blue' }
    ];

    function buildBoard() {
        const board = document.getElementById('boardContainer');
        board.innerHTML = '';
        QUIZ_DATA.forEach(cat => {
            const catDiv = document.createElement('div');
            catDiv.className = 'category';
            catDiv.innerHTML = `<div class="title">${cat.category}</div><div class="tiles" id="tiles-${cat.base}"></div>`;
            board.appendChild(catDiv);
            const tilesDiv = catDiv.querySelector('.tiles');
            cat.questions.forEach(q => {
                const tile = document.createElement('a');
                tile.className = `tile tile-${q.points}`;
                tile.textContent = q.points;
                // رابط إلى صفحة السؤال الديناميكية مع المعاملات
                tile.href = `question.html?cat=${encodeURIComponent(cat.base)}&pts=${q.points}`;
                const key = `answered_${cat.base}_${q.points}`;
                if (localStorage.getItem(key) === 'true') tile.classList.add('answered');
                tilesDiv.appendChild(tile);
            });
        });
    }

    function buildTeams() {
        const container = document.getElementById('teamsContainer');
        container.innerHTML = '';
        TEAMS.forEach(team => {
            const teamDiv = document.createElement('div');
            teamDiv.className = 'team';
            teamDiv.dataset.team = team.id;
            if (getCurrentTeam() === team.id) teamDiv.classList.add('active-team');

            teamDiv.innerHTML = `
                <div class="team-actions" style="display:flex; gap:8px; height:60px;">
                    <button class="btn-subtract" style="flex:1; background:#eb7e66; color:white; border:none; font-size:24px; border-radius:11px;" onclick="event.stopPropagation(); adjustManual('${team.id}', -200)">-200</button>
                    <button class="btn-add" style="flex:1; background:#eaac8b; color:white; border:none; font-size:24px; border-radius:11px;" onclick="event.stopPropagation(); adjustManual('${team.id}', 200)">+200</button>
                </div>
                <div class="team-info ${team.css}">
                    <div class="team-score" id="score-${team.id}">${getTeamScore(team.id)}</div>
                    <div class="team-name">${team.name}</div>
                </div>
            `;
            teamDiv.addEventListener('click', () => {
                setActiveTeam(team.id);
                updateTeamHighlight();
            });
            container.appendChild(teamDiv);
        });
    }

    function updateTeamHighlight() {
        const current = getCurrentTeam();
        document.querySelectorAll('.team').forEach(t => t.classList.toggle('active-team', t.dataset.team === current));
        const team = TEAMS.find(t => t.id === current);
        document.getElementById('teamIndicator').textContent = `الدور: ${team ? team.name : current}`;
    }

    function adjustManual(teamId, amount) {
        let score = getTeamScore(teamId);
        score += amount;
        localStorage.setItem('score_' + teamId, score);
        document.getElementById('score-' + teamId).textContent = score;
    }

    function showResults() {
        const list = document.getElementById('resultsList');
        list.innerHTML = '';
        const data = TEAMS.map(t => ({ name: t.name, score: getTeamScore(t.id) })).sort((a,b) => b.score - a.score);
        data.forEach((item, idx) => {
            const li = document.createElement('li');
            li.style.padding = '10px'; li.style.fontSize = '28px';
            li.textContent = `${idx+1}. ${item.name} - ${item.score} نقطة`;
            list.appendChild(li);
        });
        document.getElementById('section-game').style.display = 'none';
        document.getElementById('section-results').style.display = 'block';
    }

    function hideResults() {
        document.getElementById('section-game').style.display = 'flex';
        document.getElementById('section-results').style.display = 'none';
    }

    function resetGame() {
        if (confirm('إعادة ضبط كل شيء؟')) {
            TEAMS.forEach(t => localStorage.removeItem('score_' + t.id));
            QUIZ_DATA.forEach(cat => cat.questions.forEach(q => localStorage.removeItem(`answered_${cat.base}_${q.points}`)));
            setCurrentTeam('red');
            location.reload();
        }
    }

    window.onload = () => {
        buildBoard();
        buildTeams();
        updateTeamHighlight();
    };
    window.addEventListener('focus', () => {
        buildBoard();
        TEAMS.forEach(t => {
            const el = document.getElementById('score-' + t.id);
            if (el) el.textContent = getTeamScore(t.id);
        });
        updateTeamHighlight();
    });
</script>
</body>
</html>
