<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سؤال المسابقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin:0; background:#1a1a1a; font-family:'Tajawal',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; color:white; }
        .container { background:#2d4b6e; border-radius:24px; padding:40px; max-width:600px; width:90%; text-align:center; }
        h2 { font-size:32px; margin:0; } .points { font-size:60px; font-weight:700; margin:10px 0; } .question { font-size:28px; margin:20px 0; }
        .answer-section { background:#1a2847; padding:20px; border-radius:12px; margin:20px 0; } .answer-label { color:#f59e0b; font-size:20px; } .answer-text { font-size:32px; font-weight:700; margin-top:10px; }
        .btn { padding:16px 32px; border:none; border-radius:12px; font-size:24px; font-weight:700; cursor:pointer; color:white; margin:10px; } .btn-correct { background:#4caf50; } .btn-wrong { background:#f44336; }
        .back-link { display:block; margin-top:20px; color:#aaa; text-decoration:none; font-size:18px; }
    </style>
</head>
<body>
<div class="container">
    <h2 id="catTitle">...</h2>
    <div class="points" id="pointVal">...</div>
    <div class="question" id="questionText">...</div>
    <div class="answer-section">
        <div class="answer-label"> الإجابة الصحيحة</div>
        <div class="answer-text" id="correctAnswer">...</div>
    </div>
    <button class="btn btn-correct" id="btnCorrect"> إجابة صحيحة</button>
    <button class="btn btn-wrong" id="btnWrong"> إجابة خاطئة</button>
    <br>
    <a class="back-link" href="index.html"> العودة للوحة</a>
</div>

<script src="questions-data.js"></script>
<script src="game.js"></script>
<script>
    // قراءة المعاملات من الرابط
    const params = new URLSearchParams(window.location.search);
    const catBase = params.get('cat');
    const points = parseInt(params.get('pts'));

    // البحث عن السؤال في البيانات
    let questionObj = null;
    let categoryName = '';
    for (let cat of QUIZ_DATA) {
        if (cat.base === catBase) {
            categoryName = cat.category;
            questionObj = cat.questions.find(q => q.points === points);
            break;
        }
    }

    if (questionObj) {
        document.getElementById('catTitle').textContent = categoryName;
        document.getElementById('pointVal').textContent = points + ' نقطة';
        document.getElementById('questionText').textContent = questionObj.question;
        document.getElementById('correctAnswer').textContent = questionObj.answer;
        document.getElementById('btnCorrect').innerHTML = ` إجابة صحيحة (+${points})`;
        document.getElementById('btnWrong').innerHTML = ` إجابة خاطئة (-${points})`;
    } else {
        document.body.innerHTML = '<h1 style="color:white;text-align:center;">لم يتم العثور على السؤال</h1>';
    }

    document.getElementById('btnCorrect').addEventListener('click', function() {
        addCurrentTeamPoints(points);
        localStorage.setItem(`answered_${catBase}_${points}`, 'true');
        nextTeam();
        window.location.href = 'index.html';
    });

    document.getElementById('btnWrong').addEventListener('click', function() {
        addCurrentTeamPoints(-points);
        localStorage.setItem(`answered_${catBase}_${points}`, 'true');
        nextTeam();
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
