<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرج</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0a0a0a;
  color: #fff;
  overflow-x: hidden;
}

/* ===================== NAV ===================== */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3rem;
}

/* اللوجو على اليمين */
.nav-logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-logo-group img {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(255,255,255,0.1);
}
.nav-logo-group .main-title {
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 2px;
  font-family: 'Verdana', sans-serif;
  line-height: 1;
}
.nav-logo-group .by-line {
  font-size: 10px;
  color: #666;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

/* ===================== HERO ===================== */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  background-image: url('pictures/pic back/gmu.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-color: #0a0a0a;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.58);
}
.hero > * { position: relative; z-index: 1; }
.hero h1 {
  font-size: 3.2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 1rem;
  letter-spacing: -1px;
}
.hero p {
  font-size: 1rem;
  color: #bbb;
  margin-bottom: 2.5rem;
  letter-spacing: 1px;
}
.hero-btns {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}
.hero-btn {
  padding: 14px 36px;
  border: 1px solid rgba(255,255,255,0.35);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  letter-spacing: 2px;
  transition: all 0.3s;
  background: transparent;
  display: inline-block;
}
.hero-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.7); }
.hero-btn.secondary {
  border-color: rgba(255,255,255,0.18);
  color: #aaa;
}
.hero-btn.secondary:hover { color: #fff; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.06); }

/* ===================== PROJECTS SECTION ===================== */
.projects-section {
  padding: 120px 3rem 100px;
  min-height: 100vh;
  background-color: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.section-title {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 60px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 4px;
  opacity: 0.9;
}

/* ===================== SCROLL LIST ===================== */
.scroll-list-container {
  position: relative;
  width: 100%;
  max-width: 700px;
}
.scroll-list {
  max-height: 580px;
  overflow-y: auto;
  overflow-x: visible;
  padding: 8px 4px;
}
.scroll-list::-webkit-scrollbar { width: 5px; }
.scroll-list::-webkit-scrollbar-track { background: transparent; }
.scroll-list::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 4px; }

.list-gradient-top {
  position: absolute; top: 0; left: 0; right: 0; height: 60px;
  background: linear-gradient(to bottom, #0a0a0a, transparent);
  pointer-events: none; z-index: 2; transition: opacity 0.3s;
}
.list-gradient-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
  background: linear-gradient(to top, #0a0a0a, transparent);
  pointer-events: none; z-index: 2; transition: opacity 0.3s;
}

/* ===================== ITEM WRAPPER ===================== */
.list-item-wrapper {
  margin-bottom: 12px;
  opacity: 0;
  transform: scale(0.93) translateY(12px);
  transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.34,1.3,0.64,1);
  position: relative;
  overflow: visible;
}
.list-item-wrapper.in-view { opacity: 1; transform: scale(1) translateY(0); }

/* ===================== LIST ITEM ===================== */
.list-item {
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: stretch;
  transition: border-color 0.25s, transform 0.22s ease;
  position: relative;
  overflow: hidden;
  min-height: 72px;
}

/* طبقة الصورة */
.item-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: transform 0.5s ease, opacity 0.3s;
  opacity: 0.18;
  z-index: 0;
}
.list-item:hover .item-bg,
.list-item.hovered .item-bg {
  opacity: 0.32;
  transform: scale(1.04);
}

/* overlay داكن فوق الصورة */
.item-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to left, rgba(10,10,10,0.6) 0%, rgba(10,10,10,0.85) 100%);
  z-index: 1;
}

.list-item:hover, .list-item.hovered {
  border-color: rgba(255,255,255,0.18);
}

/* ===================== الجزء الرئيسي ===================== */
.item-main {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  position: relative;
  z-index: 2;
}

.item-number {
  font-size: 10px;
  font-weight: 700;
  color: #333;
  letter-spacing: 1px;
  font-family: 'Courier New', monospace;
  min-width: 22px;
  flex-shrink: 0;
  transition: color 0.25s;
}
.list-item:hover .item-number,
.list-item.hovered .item-number { color: #555; }

/* ===================== اسم + التاريخ من وراءه ===================== */
.item-name-group {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
  overflow: visible;
}

.item-name {
  font-size: 15px;
  font-weight: 600;
  color: #ccc;
  white-space: nowrap;
  transition: color 0.25s;
  position: relative;
  z-index: 2;
}
.list-item:hover .item-name,
.list-item.hovered .item-name { color: #fff; }

/*
  التاريخ يجلس مباشرة بعد الاسم (يسار الاسم في RTL)
  يبدأ مخفي خلف الاسم (translateX يجعله خلف الاسم)
  ويخرج للخارج على اليسار عند الـ hover
*/
.item-date {
  position: absolute;
  right: 90%;           /* يبدأ عند يمين الـ name-group = خلف الاسم */
  top: 50%;
  transform: translateY(-50%) translateX(40px);
  padding-left: 14px;    /* مسافة بين الاسم والتاريخ */

  font-size: 10px;
  color: #a8a8a8;
  letter-spacing: 2px;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  z-index: 1;

  transition: opacity 0.32s ease, transform 0.35s cubic-bezier(0.34,1.1,0.64,1);
}
.list-item:hover .item-date,
.list-item.hovered .item-date {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* ===================== زر السهم ===================== */
.item-link-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,0.06);
  color: #2e2e2e;
  font-size: 16px;
  text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  cursor: pointer;
  position: relative;
  z-index: 2;
  border-radius: 10px 0 0 10px;
}
.item-link-btn:hover {
  background: rgba(255,255,255,0.07);
  color: #fff;
  border-color: rgba(255,255,255,0.15);
}

/* ===================== BLUR OVERLAY ===================== */
.page-blur-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  backdrop-filter: blur(20px) brightness(0.3);
  -webkit-backdrop-filter: blur(20px) brightness(0.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.page-blur-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* ===================== PROJECT MODAL ===================== */
.project-modal {
  position: fixed;
  inset: 0;
  z-index: 2100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.93) translateY(18px);
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34,1.2,0.64,1);
}
.project-modal.active {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

.modal-card {
  background: #0f0f0f;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  width: 100%;
  max-width: 580px;
  max-height: 88vh;
  overflow-y: auto;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: #1e1e1e transparent;
}
.modal-card::-webkit-scrollbar { width: 4px; }
.modal-card::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 4px; }

/* زر الإغلاق */
.modal-close {
  position: absolute;
  top: 14px;
  left: 14px;
  width: 30px;
  height: 30px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  color: #888;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 10;
}
.modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.3); }

/* صور المشروع */
.modal-images {
  width: 100%;
  overflow-x: auto;
  display: flex;
  gap: 0;
  scrollbar-width: none;
  border-radius: 16px 16px 0 0;
}
.modal-images::-webkit-scrollbar { display: none; }
.modal-img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  flex-shrink: 0;
  border-radius: 16px 16px 0 0;
}
.modal-images.multi .modal-img {
  width: 85%;
  border-radius: 0;
}
.modal-images.multi .modal-img:first-child { border-radius: 16px 0 0 0; }
.modal-images.multi .modal-img:last-child  { border-radius: 0 16px 0 0; }

/* محتوى المودال */
.modal-body {
  padding: 28px 32px 32px;
}

.modal-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 10px;
}
.modal-desc {
  font-size: 14px;
  color: #777;
  line-height: 1.85;
  margin-bottom: 22px;
}
.modal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}
.modal-tag {
  padding: 5px 14px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  font-size: 10px;
  color: #888;
  letter-spacing: 1px;
  font-family: 'Courier New', monospace;
  background: rgba(255,255,255,0.02);
}
.modal-enter-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 26px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 1px;
  transition: all 0.25s;
  background: transparent;
  cursor: pointer;
}
.modal-enter-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.45); }

/* ===================== FOOTER ===================== */
footer {
  background: #050505;
  padding: 60px 3rem 40px;
  text-align: center;
  border-top: 1px solid rgba(255,255,255,0.05);
}
footer p { color: #2e2e2e; font-size: 0.85rem; letter-spacing: 1px; }

/* ===================== MOBILE ===================== */
@media (max-width: 768px) {
  .hero h1 { font-size: 2rem; }
  .projects-section { padding: 100px 1.2rem 80px; }
  .modal-body { padding: 20px; }
  .modal-img { height: 180px; }
  nav { padding: 0 1.5rem; }
  .hero-btns { flex-direction: column; align-items: center; gap: 12px; }
}
</style>
</head>
<body>

<div class="page-blur-overlay" id="pageBlur"></div>

<!-- المودال -->
<div class="project-modal" id="projectModal">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-images" id="modalImages"></div>
    <div class="modal-body">
      <h2 class="modal-title" id="modalTitle"></h2>
      <p  class="modal-desc"  id="modalDesc"></p>
      <div class="modal-tags" id="modalTags"></div>
      <button class="modal-enter-btn" id="modalEnterBtn">
        دخول للمشروع <span>↗</span>
      </button>
    </div>
  </div>
</div>

<nav>
  <!-- اللوجو على اليمين -->
  <div class="nav-logo-group">
    <div>    <img src="pictures/pic projects/Rectangle 2 (7).png" alt="صورة">

      <div class="main-title">المدرج</div>
      <div class="by-line">لمحمد عجل محمد الدوسري</div>
    </div>
  </div>
</nav>

<section class="hero">
  <h1>صفحة تجمع تجاربي العملية بالخط زمني</h1>
  <p>اضغط على المشروع لتشوف التفاصيل</p>
  <div class="hero-btns">
    <a href="#projects" class="hero-btn" id="timelineBtn">الخط الزمني</a>
    <a href="pictures/pic projects/MOHAMMED ALDAWSARI_CV.pdf"    class="hero-btn secondary" target="_blank" rel="noopener">السيرة الذاتية</a>
    <a href="https://github.com/m00495"    class="hero-btn secondary" target="_blank" rel="noopener">Github</a>

  </div>
</section>

<section class="projects-section" id="projects">
  <h2 class="section-title">التجارب</h2>
  <div class="scroll-list-container">
    <div class="list-gradient-top"    id="gradTop"    style="opacity:0"></div>
    <div class="scroll-list"          id="scrollList"></div>
    <div class="list-gradient-bottom" id="gradBottom"></div>
  </div>
</section>

<footer>
  <p>&copy; 2026 المدرج. جميع الحقوق محفوظة.</p>
</footer>

<script>
/* =========================================================
   بيانات المشاريع
   ========================================================= */
const projects = [
  {
    id: 1,
    name: "إدارة المكتبة",
    url: "https://github.com/m00495/AL_ibrarymanagement",
    date: "يناير 2024",
    thumb: "pictures/pic projects/al_li.png",
    images: ["pictures/pic projects/al_li.png"],
    desc: "نظام لإدارة مكتبة يتيح تسجيل الكتب والأعضاء وتتبع الإعارات. يوفر واجهة بسيطة لإضافة الكتب وتسجيل العمليات وإنشاء التقارير.",
    tags: ["Python", "SQLite", "Tkinter"]
  },
  {
    id: 2,
    name: "لعبة المسابقة",
    url: "proj_2/index.html",   
    date: "يوليو 2025",
    thumb: "https://images.unsplash.com/photo-1611996575749-79b9a5f5a77a?w=800&h=400&fit=crop",
    desc: "لعبة مسابقة تفاعلية متعددة الفرق مع لوحة أسئلة ونقاط دائمة وتناوب تلقائي للأدوار.",
    tags: ["JavaScript", "HTML", "CSS", "Game"]
  },
  {
    id: 3,
    name: "Project Three",
    url: "https://example.com/project3",
    date: "مايو 2024",
    thumb: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&h=400&fit=crop",
    images: ["https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&h=500&fit=crop"],
    desc: "وصف المشروع الثالث — عدّل هذا النص.",
    tags: ["React", "Node.js"]
  },
  {
    id: 4,
    name: "Project Four",
    url: "https://example.com/project4",
    date: "يوليو 2024",
    thumb: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&h=400&fit=crop",
    images: ["https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&h=500&fit=crop"],
    desc: "وصف المشروع الرابع — عدّل هذا النص.",
    tags: ["Python", "Flask"]
  },
  {
    id: 5,
    name: "Project Five",
    url: "https://example.com/project5",
    date: "سبتمبر 2024",
    thumb: "https://images.unsplash.com/photo-1504639725590-34d0984388bd?w=800&h=400&fit=crop",
    images: ["https://images.unsplash.com/photo-1504639725590-34d0984388bd?w=800&h=500&fit=crop"],
    desc: "وصف المشروع الخامس — عدّل هذا النص.",
    tags: ["Vue.js", "Firebase"]
  },
  {
    id: 6,
    name: "Project Six",
    url: "https://example.com/project6",
    date: "نوفمبر 2024",
    thumb: "https://images.unsplash.com/photo-1593642632559-0c6d3fc62b89?w=800&h=400&fit=crop",
    images: ["https://images.unsplash.com/photo-1593642632559-0c6d3fc62b89?w=800&h=500&fit=crop"],
    desc: "وصف المشروع السادس — عدّل هذا النص.",
    tags: ["TypeScript", "Next.js"]
  }
];

/* =========================================================
   Modal
   ========================================================= */
const pageBlur   = document.getElementById('pageBlur');
const modal      = document.getElementById('projectModal');
const modalCard  = document.getElementById('modalCard');
const modalClose = document.getElementById('modalClose');

function openModal(p) {
  const imgCont = document.getElementById('modalImages');
  imgCont.innerHTML = '';
  (p.images||[]).forEach(src => {
    const img = document.createElement('img');
    img.src = src; img.className = 'modal-img'; img.alt = p.name;
    imgCont.appendChild(img);
  });
  imgCont.classList.toggle('multi', (p.images||[]).length > 1);

  document.getElementById('modalTitle').textContent = p.name;
  document.getElementById('modalDesc').textContent  = p.desc || '';

  const tagsEl = document.getElementById('modalTags');
  tagsEl.innerHTML = '';
  (p.tags||[]).forEach(t => {
    const s = document.createElement('span');
    s.className = 'modal-tag'; s.textContent = t;
    tagsEl.appendChild(s);
  });

  // زر دخول المشروع – يفتح في نافذة جديدة
  const enterBtn = document.getElementById('modalEnterBtn');
  enterBtn.onclick = function() {
    window.open(p.url, '_blank');
  };

  pageBlur.classList.add('active');
  modal.classList.add('active');
  modalCard.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  pageBlur.classList.remove('active');
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
pageBlur.addEventListener('click', closeModal);
modalCard.addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

/* =========================================================
   Build List
   ========================================================= */
const scrollList = document.getElementById('scrollList');
const gradTop    = document.getElementById('gradTop');
const gradBottom = document.getElementById('gradBottom');

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    e.isIntersecting
      ? e.target.classList.add('in-view')
      : e.target.classList.remove('in-view');
  });
}, { threshold: 0.15, root: scrollList });

projects.forEach((project, index) => {
  const wrapper = document.createElement('div');
  wrapper.className = 'list-item-wrapper';

  // السهم يستخدم onclick لفتح الرابط في نافذة جديدة
  wrapper.innerHTML = `
    <div class="list-item" data-id="${project.id}">
      <div class="item-bg" style="background-image:url('${project.thumb}')"></div>
      <div class="item-overlay"></div>

      <div class="item-main">
        <span class="item-number">${String(index+1).padStart(2,'0')}</span>
        <div class="item-name-group">
          <span class="item-date">${project.date}</span>
          <span class="item-name">${project.name}</span>
        </div>
      </div>

      <span class="item-link-btn" onclick="window.open('${project.url}','_blank')">↗</span>
    </div>
  `;

  const itemEl  = wrapper.querySelector('.list-item');
  const mainEl  = wrapper.querySelector('.item-main');
  const linkBtn = wrapper.querySelector('.item-link-btn');

  itemEl.addEventListener('mouseenter', () => itemEl.classList.add('hovered'));
  itemEl.addEventListener('mouseleave', () => itemEl.classList.remove('hovered'));

  // النقر على الجزء الرئيسي يفتح المودال (وليس المشروع)
  mainEl.addEventListener('click', () => openModal(project));

  // النقر على السهم يفتح الرابط في نافذة جديدة (تم تعريفه مباشرة فوق)

  scrollList.appendChild(wrapper);
  observer.observe(wrapper);
});

/* gradient */
scrollList.addEventListener('scroll', () => {
  const { scrollTop, scrollHeight, clientHeight } = scrollList;
  gradTop.style.opacity = Math.min(scrollTop/50, 1);
  const d = scrollHeight - (scrollTop + clientHeight);
  gradBottom.style.opacity = scrollHeight <= clientHeight ? 0 : Math.min(d/50, 1);
});

/* smooth scroll */
document.getElementById('timelineBtn').addEventListener('click', function(e) {
  e.preventDefault();
  const target = document.getElementById('projects');
  if (!target) return;
  const startY = window.scrollY;
  const endY   = target.getBoundingClientRect().top + startY - 70;
  const dist   = endY - startY;
  let t0 = null;
  const ease = t => t < 0.5 ? 8*t*t*t*t : 1-Math.pow(-2*t+2,4)/2;
  const step = ts => {
    if (!t0) t0 = ts;
    const p = Math.min((ts-t0)/1100, 1);
    window.scrollTo(0, startY + dist*ease(p));
    if (p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
});
</script>
</body>
