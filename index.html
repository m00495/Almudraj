<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرج</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0a0a0a;
  color: #fff;
  overflow-x: hidden;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 3rem;
}

.logo {
  display: flex;
  flex-direction:column;  /* يجعل العناصر تصطف عمودياً */
  align-items:start;     /* يوسّط المحتوى أفقياً */
  gap: 0px;               /* المسافة بين الأسطر */
  text-align: center;      /* توسيط النص */
}

.logo .by-line {
  display: flex;
  align-items: center;
  gap: 8px;               /* المسافة بين "by" والصورة */
  font-size: 10px;        /* حجم خط أصغر للملحق */
  color: #acacac;            /* لون خفيف للملحق */
}

.logo .by-line img {
  width: 40px;
  height: 40px;
}
nav .logo {
  font-size: 30px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-family: 'Verdana, sans-serif';
}

.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  background: #0a0a0a;
}

.hero h1 {
  font-size: 3.5rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 1rem;
  letter-spacing: -1px;
}

.hero p {
  font-size: 1rem;
  color: #666;
  margin-bottom: 2.5rem;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.hero-btn {
  padding: 14px 36px;
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: all 0.3s, transform 0.15s ease;
  background: transparent;
  display: inline-block;
}

.hero-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.6);
}

.hero-btn:active {
  transform: scale(0.97);
}

/* ===================== PAGE BLUR OVERLAY ===================== */

.page-blur-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  backdrop-filter: blur(18px) brightness(0.4);
  -webkit-backdrop-filter: blur(18px) brightness(0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
}

.page-blur-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* ===================== TIMELINE ===================== */

.timeline-section {
  padding: 120px 3rem;
  min-height: 100vh;
  background-image: url('pic projects/Rectangle 2 (7).png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-color: #0a0a0a;
  position: relative;
  z-index: 1;
}

.section-title {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 100px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 4px;
  opacity: 0.9;
}

.timeline-container {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 210px; /* مسافة أكبر بين الصفوف */
}

/* صف واحد في المنتصف */
.row-single {
  display: flex;
  justify-content: center;
}

/* صف ثنين جنب بعض */
.row-double {
  display: flex;
  justify-content: center;
  gap: 110px; /* مسافة أكبر بين المعينات في نفس الصف */
}

/* ===================== DIAMOND ===================== */

.diamond-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  cursor: pointer;
  /* رفعه فوق الـ overlay عند الضغط */
  position: relative;
  z-index: 1;
  transition: z-index 0s;
}

.diamond-wrap.active-diamond {
  z-index: 600; /* فوق الـ blur overlay */
}

.diamond-outer {
  width: 180px;
  height: 180px;
  position: relative;
  transform: rotate(45deg);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.diamond-wrap:hover .diamond-outer {
  transform: rotate(45deg) scale(1.08);
}

.diamond-inner {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.25);
  transition: border-color 0.3s;
  position: relative;
}

.diamond-wrap:hover .diamond-inner {
  border-color: rgba(255,255,255,0.7);
}

.diamond-inner img {
  width: 150%;
  height: 150%;
  object-fit: cover;
  transform: rotate(-45deg) translate(0%, 0%);
  transition: transform 0.5s ease;
  pointer-events: none;
}

.diamond-wrap:hover .diamond-inner img {
  transform: rotate(-45deg) translate(0%, 0%) scale(1.1);
}

/* ===================== NAME ABOVE BLUR (outside diamond) ===================== */

/* wrapper يحتوي المعين + الاسم معاً */
.diamond-and-name {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* الاسم يطفو فوق المعين في المنتصف، z-index أعلى من الـ overlay */
.diamond-name-overlay {
  position: absolute;
  top: 100%;
  left: 100%;
  transform: translate(-50%, -50%);
  z-index: 700;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ascii-container {
  position: relative;
  width: 230px;
  height: 80px;
  opacity: 0;
  transform: scale(0.85) translateY(6px);
  transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ascii-container.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

.ascii-pre {
  position: absolute;
  inset: 0;
  text-align: center;
  font-family: 'Courier New', monospace;
  font-size: 8px;
  line-height: 1em;
  white-space: pre;
  background-image: radial-gradient(circle, #ff6188 0%, #fc9867 50%, #ffd866 100%);
  -webkit-text-fill-color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  user-select: none;
  z-index: 9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 8px;
}

.name-link {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Courier New', monospace;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
  letter-spacing: 3px;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.35s ease, color 0.2s;
  z-index: 10;
  text-shadow:
    0 0 20px rgba(255,100,100,0.6),
    0 0 8px rgba(0,0,0,1),
    0 2px 4px rgba(0,0,0,0.9);
}

.name-link.show {
  opacity: 1;
}

.name-link:hover {
  color: #ffd866;
}

/* ===================== FOOTER ===================== */

footer {
  background: #050505;
  color: #fff;
  padding: 60px 3rem 40px;
  text-align: center;
  border-top: 1px solid rgba(255,255,255,0.06);
  position: relative;
  z-index: 1;
}

footer p {
  color: #444;
  font-size: 0.85rem;
  letter-spacing: 1px;
}

/* ===================== MOBILE ===================== */

@media (max-width: 768px) {
  /* كل الصفوف تصير عمود واحد */
  .row-double {
    flex-direction: column;
    align-items: center;
    gap: 80px;
  }
  .row-single {
    justify-content: center;
  }
  .timeline-container {
    gap: 80px;
  }
  .diamond-outer { width: 140px; height: 140px; }
  .ascii-container { width: 180px; height: 60px; }
  .ascii-pre { font-size: 7px; }
  .name-link { font-size: 9px; }
  .hero h1 { font-size: 2.2rem; }
}
</style>
</head>
<body>

<!-- Blur Overlay — يغطي كل الصفحة ما عدا المعين المفتوح -->
<div class="page-blur-overlay" id="pageBlurOverlay"></div>

<nav>
  <div class="logo">
    <span class ='main-title'>المدرج</span> 
    <div class="by-line">
        <span> لمحمد عجل محمد الدوسري</span>
       <img src="pic projects\Rectangle 2 (7).png" alt="Flowers in Chania" ;>
   </div>
  </div>
</nav>

<section class="hero">
  <h1>صفحة تجمع تجاربي العملية بالخط زمني</h1>
  <p>اضغط على المعين بعدها الاسم لترى اكثر</p>
  <a href="#timeline" class="hero-btn">الخط الزمني
  </a>
</section>

<section class="timeline-section" id="timeline">
  <h2 class="section-title">Projects</h2>
  <div class="timeline-container" id="timelineContainer"></div>
</section>

<footer>
  <p>&copy; 2026 المدرج. All rights reserved.</p>
</footer>

<script>
/* =========================================================
   بيانات المشاريع — عدّل هنا
   ========================================================= */
const projects = [
  {
    id: 1,
    name: "11111",
    url: "https://github.com/m00495/AL_ibrarymanagement",
    image: "pic projects/al_li.png"
  },
  {
    id: 2,
    name: "Project Two",
    url: "https://example.com/project2",
    image: "https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&h=500&fit=crop"
  },
  {
    id: 3,
    name: "Project Three",
    url: "https://example.com/project3",
    image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=500&h=500&fit=crop"
  },
  {
    id: 4,
    name: "Project Four",
    url: "https://example.com/project4",
    image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=500&h=500&fit=crop"
  },
  {
    id: 5,
    name: "Project Five",
    url: "https://example.com/project5",
    image: "https://images.unsplash.com/photo-1504639725590-34d0984388bd?w=500&h=500&fit=crop"
  },
  {
    id: 6,
    name: "Project Six",
    url: "https://example.com/project6",
    image: "https://images.unsplash.com/photo-1593642632559-0c6d3fc62b89?w=500&h=500&fit=crop"
  }
];

/* =========================================================
   ASCII Filter
   ========================================================= */
const CHARSET = ' .\'`^",:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';

class AsciiRenderer {
  constructor(containerEl, text, fontSize = 8) {
    this.container = containerEl;
    this.text = text;
    this.fontSize = fontSize;
    this.animId = null;
    this.startTime = null;

    this.offCanvas = document.createElement('canvas');
    this.offCtx = this.offCanvas.getContext('2d');

    this.pre = containerEl.querySelector('.ascii-pre');
    this._drawText();
  }

  _drawText() {
    const fs = 60;
    this.offCanvas.width = 400;
    this.offCanvas.height = 80;
    const ctx = this.offCtx;
    ctx.clearRect(0, 0, 400, 80);
    ctx.font = `700 ${fs}px 'Courier New', monospace`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.text, 200, 40);
  }

  _sample(t) {
    const w = this.offCanvas.width;
    const h = this.offCanvas.height;
    const cols = Math.floor(230 / (this.fontSize * 0.6));
    const rows = Math.floor(80 / this.fontSize);
    const imgData = this.offCtx.getImageData(0, 0, w, h).data;
    let str = '';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = Math.floor((x / cols) * w);
        const py = Math.floor((y / rows) * h);
        const i = (py * w + px) * 4;
        const a = imgData[i + 3];
        if (a < 10) { str += ' '; continue; }
        const wave = Math.sin(t * 3 + x * 0.5 + y * 0.3) * 0.15;
        const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
        let gray = ((0.3*r + 0.6*g + 0.1*b) / 255) + wave;
        gray = Math.max(0, Math.min(1, gray));
        const idx = Math.floor((1 - gray) * (CHARSET.length - 1));
        str += CHARSET[CHARSET.length - idx - 1];
      }
      str += '\n';
    }
    this.pre.textContent = str;
  }

  start() {
    this.startTime = performance.now();
    const loop = (now) => {
      const t = (now - this.startTime) / 1000;
      this._sample(t);
      this.animId = requestAnimationFrame(loop);
    };
    this.animId = requestAnimationFrame(loop);
  }

  stop() {
    if (this.animId) cancelAnimationFrame(this.animId);
    this.animId = null;
  }
}

/* =========================================================
   Build Layout  1 - 2 - 1 - 2 pattern
   ========================================================= */
const container = document.getElementById('timelineContainer');
const blurOverlay = document.getElementById('pageBlurOverlay');
const renderers = {};
const activeProject = { id: null };

function closeActive() {
  if (!activeProject.id) return;
  const id = activeProject.id;
  const oldWrap  = document.querySelector(`.diamond-wrap[data-id="${id}"]`);
  const oldAscii = document.getElementById(`ascii-${id}`);
  const oldLink  = document.getElementById(`link-${id}`);

  oldAscii.classList.remove('visible');
  oldLink.classList.remove('show');
  if (renderers[id]) renderers[id].stop();
  if (oldWrap) oldWrap.classList.remove('active-diamond');

  blurOverlay.classList.remove('active');
  activeProject.id = null;
}

/* إغلاق عند الضغط على الـ overlay */
blurOverlay.addEventListener('click', closeActive);

function makeDiamond(project) {
  const wrap = document.createElement('div');
  wrap.className = 'diamond-wrap';
  wrap.dataset.id = project.id;
  wrap.innerHTML = `
    <div class="diamond-and-name">
      <div class="diamond-outer">
        <div class="diamond-inner">
          <img src="${project.image}" alt="${project.name}" loading="lazy">
        </div>
      </div>
      <!-- الاسم خارج المعين، يطفو فوقه بـ z-index أعلى من الـ blur overlay -->
      <div class="diamond-name-overlay">
        <div class="ascii-container" id="ascii-${project.id}">
          <pre class="ascii-pre"></pre>
          <a class="name-link" id="link-${project.id}" href="${project.url}" target="_blank" rel="noopener">${project.name}</a>
        </div>
      </div>
    </div>
  `;

  wrap.addEventListener('click', (e) => {
    const asciiEl = document.getElementById(`ascii-${project.id}`);
    const linkEl  = document.getElementById(`link-${project.id}`);
    const alreadyOpen = activeProject.id === project.id;

    /* أغلق الي مفتوح */
    if (activeProject.id && activeProject.id !== project.id) {
      closeActive();
    }

    if (alreadyOpen) {
      closeActive();
      return;
    }

    /* افتح الجديد */
    wrap.classList.add('active-diamond');
    blurOverlay.classList.add('active');

    asciiEl.classList.add('visible');
    setTimeout(() => {
      linkEl.classList.add('show');
      linkEl.style.pointerEvents = 'auto';
    }, 500);

    /* امنع الـ link من إغلاق المعين */
    linkEl.addEventListener('click', e => e.stopPropagation(), { once: false });

    if (!renderers[project.id]) {
      renderers[project.id] = new AsciiRenderer(asciiEl, project.name);
    }
    renderers[project.id].start();
    activeProject.id = project.id;
  });

  return wrap;
}

function buildLayout() {
  const pattern = [1, 2, 1, 2];
  let idx = 0;

  pattern.forEach(count => {
    const row = document.createElement('div');
    row.className = count === 1 ? 'row-single' : 'row-double';

    for (let i = 0; i < count && idx < projects.length; i++, idx++) {
      row.appendChild(makeDiamond(projects[idx]));
    }
    container.appendChild(row);
  });
}

buildLayout();

/* =========================================================
   Smooth Scroll — زر View Timeline
   ========================================================= */
document.querySelector('.hero-btn').addEventListener('click', function(e) {
  e.preventDefault();
  const target = document.getElementById('timeline');
  if (!target) return;

  const startY   = window.scrollY;
  const endY     = target.getBoundingClientRect().top + startY - 70; /* 70 = nav height */
  const distance = endY - startY;
  const duration = 1100; /* ms — خفيف وسلس */
  let startTime  = null;

  function easeInOutQuart(t) {
    return t < 0.5
      ? 8 * t * t * t * t
      : 1 - Math.pow(-2 * t + 2, 4) / 2;
  }

  function step(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed  = timestamp - startTime;
    const progress = Math.min(elapsed / duration, 1);
    window.scrollTo(0, startY + distance * easeInOutQuart(progress));
    if (progress < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
});
</script>
</body>
</html>
