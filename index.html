<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المدرج | Almudraj</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0a0a0a;
  color: #fff;
  overflow-x: hidden;
}

/* ===================== NAV ===================== */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3rem;
}

.nav-logo-group {
  display: flex;
  align-items: center;
  gap: 13px;
}
.nav-logo-group img {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(255,255,255,0.1);
}
.nav-logo-group .main-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 2px;
  font-family: 'Verdana', sans-serif;
}
.nav-logo-group .by-line {
  font-size: 10px;
  color: #666;
  margin-top: 2px;
}

.lang-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  color: #aaa;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}
.lang-btn:hover {
  border-color: rgba(255,255,255,0.5);
  color: #fff;
  background: rgba(255,255,255,0.05);
}

/* ===================== HERO ===================== */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  background-image: url('pictures/pic back/gmu.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-color: #0a0a0a;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.58);
}
.hero > * { position: relative; z-index: 1; }
.hero h1 {
  font-size: 3.2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 1rem;
}
.hero p {
  font-size: 1rem;
  color: #bbb;
  margin-bottom: 2.5rem;
}
.hero-btns {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}
.hero-btn {
  padding: 14px 36px;
  border: 1px solid rgba(255,255,255,0.35);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 2px;
  transition: all 0.3s;
  background: transparent;
}
.hero-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.7); }
.hero-btn.secondary {
  border-color: rgba(255,255,255,0.18);
  color: #aaa;
}
.hero-btn.secondary:hover { color: #fff; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.06); }

/* ===================== PROJECTS SECTION ===================== */
.projects-section {
  padding: 120px 3rem 100px;
  min-height: 100vh;
  background-color: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.section-title {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 60px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 4px;
}

/* ===================== SCROLL LIST ===================== */
.scroll-list-container {
  position: relative;
  width: 100%;
  max-width: 700px;
}
.scroll-list {
  max-height: 580px;
  overflow-y: auto;
  overflow-x: visible;
  padding: 8px 4px;
}
.scroll-list::-webkit-scrollbar { width: 5px; }
.scroll-list::-webkit-scrollbar-track { background: transparent; }
.scroll-list::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 4px; }

.list-gradient-top, .list-gradient-bottom {
  position: absolute; left: 0; right: 0; height: 60px; pointer-events: none; z-index: 2;
}
.list-gradient-top { top: 0; background: linear-gradient(to bottom, #0a0a0a, transparent); }
.list-gradient-bottom { bottom: 0; background: linear-gradient(to top, #0a0a0a, transparent); }

/* ===================== LIST ITEM ===================== */
.list-item-wrapper {
  margin-bottom: 12px;
  opacity: 0;
  transform: scale(0.93) translateY(12px);
  transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.34,1.3,0.64,1);
}
.list-item-wrapper.in-view { opacity: 1; transform: scale(1) translateY(0); }

.list-item {
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
  display: flex;
  align-items: stretch;
  transition: border-color 0.25s, transform 0.22s ease;
  position: relative;
  overflow: visible;
  min-height: 72px;
  cursor: pointer;
}
.list-item:hover { border-color: rgba(255,255,255,0.18); }

.item-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0.18; z-index: 0;
  transition: transform 0.5s ease, opacity 0.3s;
}
.list-item:hover .item-bg { opacity: 0.32; transform: scale(1.04); }

.item-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to left, rgba(10,10,10,0.6) 0%, rgba(10,10,10,0.85) 100%);
  z-index: 1;
}

.item-main {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  position: relative;
  z-index: 2;
}

.item-number {
  font-size: 10px;
  font-weight: 700;
  color: #333;
  letter-spacing: 1px;
  font-family: 'Courier New', monospace;
  min-width: 22px;
  flex-shrink: 0;
}

.item-name-group {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}

.item-name {
  font-size: 15px;
  font-weight: 600;
  color: #ccc;
  white-space: nowrap;
}

.item-date {
  font-size: 10px;
  color: #a8a8a8;
  letter-spacing: 2px;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(-50%) translateX(15px);
  transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.34, 1.1, 0.64, 1);
  order: 1;
}

.list-item:hover .item-date {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

.item-link-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,0.06);
  color: #2e2e2e;
  font-size: 16px;
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
  cursor: pointer;
  z-index: 3;
  order: 2;
}
.item-link-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }

/* ===================== MODAL ===================== */
.page-blur-overlay {
  position: fixed; inset: 0; z-index: 2000;
  backdrop-filter: blur(20px) brightness(0.3);
  opacity: 0; pointer-events: none; transition: opacity 0.4s;
}
.page-blur-overlay.active { opacity: 1; pointer-events: auto; }

.project-modal {
  position: fixed; inset: 0; z-index: 2100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; pointer-events: none;
  opacity: 0; transform: scale(0.93) translateY(18px);
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34,1.2,0.64,1);
}
.project-modal.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

.modal-card {
  background: #0f0f0f; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; width: 100%; max-width: 580px;
  max-height: 88vh; overflow-y: auto; position: relative;
}
.modal-close {
  position: absolute; top: 14px; left: 14px;
  width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%; background: rgba(0,0,0,0.5); color: #888;
  font-size: 14px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; z-index: 10;
}
.modal-images { display: flex; overflow-x: auto; border-radius: 16px 16px 0 0; }
.modal-img { width: 100%; height: 240px; object-fit: cover; flex-shrink: 0; }
.modal-body { padding: 28px 32px 32px; }
.modal-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 10px; }
.modal-desc { font-size: 14px; color: #777; line-height: 1.85; margin-bottom: 22px; }
.modal-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.modal-tag {
  padding: 5px 14px; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; font-size: 10px; color: #888;
  font-family: 'Courier New', monospace;
}
.modal-enter-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 26px; border: none;
  border-radius: 8px; color: #000; font-size: 13px; font-weight: 600;
  text-decoration: none; cursor: pointer; transition: all 0.25s;
  background: #eb9c72;
}
.modal-enter-btn:hover { background: #f0a87e; }

/* ===================== FOOTER ===================== */
footer {
  background: #050505; padding: 60px 3rem 40px;
  text-align: center; border-top: 1px solid rgba(255,255,255,0.05);
}
footer p { color: #2e2e2e; font-size: 0.85rem; }

@media (max-width: 768px) {
  .hero h1 { font-size: 2rem; }
  .projects-section { padding: 100px 1.2rem 80px; }
  .modal-body { padding: 20px; }
  .modal-img { height: 180px; }
  nav { padding: 0 1.5rem; }
  .hero-btns { flex-direction: column; align-items: center; gap: 12px; }
}
</style>
</head>
<body>

<div class="page-blur-overlay" id="pageBlur"></div>

<div class="project-modal" id="projectModal">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-images" id="modalImages"></div>
    <div class="modal-body">
      <h2 class="modal-title" id="modalTitle"></h2>
      <p  class="modal-desc"  id="modalDesc"></p>
      <div class="modal-tags" id="modalTags"></div>
      <button class="modal-enter-btn" id="modalEnterBtn">
        <span data-i18n="enterProject">دخول للمشروع</span> <span>↗</span>
      </button>
    </div>
  </div>
</div>

<nav>
  <div class="nav-logo-group">
    <img src="pictures/pic projects/Rectangle 2 (7).png" alt="صورة">
    <div>
      <div class="main-title" data-i18n="siteName">المدرج</div>

    </div>
  </div>

</nav>

<section class="hero">
  <h1 data-i18n="heroTitle">صفحة تجمع تجاربي العملية بالخط زمني</h1>
  <p data-i18n="heroSub">اضغط على المشروع لتشوف التفاصيل</p>
  <div class="hero-btns">
    <a href="#projects" class="hero-btn" id="timelineBtn" data-i18n="timelineBtn">الخط الزمني</a>
    <a href="pictures/pic projects/MOHAMMED ALDAWSARI_CV.pdf" class="hero-btn secondary" target="_blank" rel="noopener" data-i18n="cvBtn">السيرة الذاتية</a>
    <a href="https://github.com/m00495" class="hero-btn secondary" target="_blank" rel="noopener">Github</a>
  </div>
</section>

<section class="projects-section" id="projects">
  <h2 class="section-title" data-i18n="sectionTitle">التجارب</h2>
  <div class="scroll-list-container">
    <div class="list-gradient-top" id="gradTop" style="opacity:0"></div>
    <div class="scroll-list" id="scrollList"></div>
    <div class="list-gradient-bottom" id="gradBottom"></div>
  </div>
</section>

<footer>
  <p data-i18n="footerText">&copy; 2026 المدرج . جميع الحقوق محفوظة محمد عجل محمد الدوسري</p>
</footer>

<script>
// ========== الترجمات ==========
const i18n = {
  ar: {

    cvBtn: 'السيرة الذاتية',
    sectionTitle: 'التجارب',
    enterProject: 'دخول للمشروع',
    footerText: '© 2026 المدرج . جميع الحقوق محفوظة محمد عجل محمد الدوسري'
  },
  en: {
    siteName: 'Almudraj',
    byLine: 'By Mohammed ijl Al-Dawsari',
    heroTitle: 'A timeline of my practical experiences',
    heroSub: 'Click on a project to see details',
    timelineBtn: 'Timeline',
    cvBtn: 'CV',
    sectionTitle: 'PROJECTS',
    enterProject: 'View Project',
    footerText: '© 2026 Al-Mudarraj. All rights reserved Mohammed ijl Al-Dawsari.'
  }
};

// ========== بيانات المشاريع (ثنائية اللغة) ==========
const projectsData = [
  {
    id: 1,
    nameAr: 'إدارة المكتبة',
    nameEn: 'Library Management',
    url: 'https://github.com/m00495/AL_ibrarymanagement',
    dateAr: 'ديسمبر 2024',
    dateEn: 'dec 2024',
    thumb: 'pictures/pic projects/al_li.png',
    images: ['pictures/pic projects/al_li.png'],
    descAr: 'مشروع تخرجي مع زملائي في الجامعة وهو نظام لإدارة مكتبة يتيح تسجيل الكتب والأعضاء وتتبع الإعارات. يوفر واجهة بسيطة لإضافة الكتب وتسجيل العمليات وإنشاء التقارير.',
    descEn: 'My graduation project with university colleagues. A library management system that enables book registration, member tracking, and loan management. Features a simple interface for adding books, recording transactions, and generating reports.',
    tags: ['Python', 'Html', 'PowerShell', 'django','shell','css']
  },
  {
    id: 2,
    nameAr: 'لعبة المجازفة',
    nameEn: 'Adventure Game',
    url: 'proj_2/index.html',
    dateAr: 'يوليو 2025',
    dateEn: 'Jul 2025',
    thumb: 'pictures/pic projects/Screenshot 2026-07-29 173923.png',
    images: ['pictures/pic projects/Screenshot 2026-07-29 173923.png'],
    descAr: 'لعبة مسابقة تفاعلية عائلية متعددة الفرق مع لوحة أسئلة ونقاط دائمة وتناوب تلقائي للأدوار شبيهه لمخمخ او سين جين لكن القوانين مختلفه وامتع',
    descEn: 'An interactive family quiz game with multiple teams, a question board, permanent points, and automatic turn rotation. Similar to trivia games but with unique rules and more fun.',
    tags: ['JavaScript', 'HTML', 'CSS', 'Game']
  },
  {
    id: 3,
    nameAr: 'نظام الكفاءة الحقليه',
    nameEn: 'Field Efficiency System',
    url: 'https://script.google.com/macros/s/AKfycbzWte3iZkrAPl8hKQ3x2nRjLnw4XI1hOgVCo_ArJxHmriNFYz3Wiik-apiaH5cBAXadmg/exec',
    dateAr: 'مايو 2026',
    dateEn: 'May 2026',
    thumb: 'pictures/pic projects/Screenshot 2026-08-01 163510.png',
    images: ['pictures/pic projects/Screenshot 2026-08-01 125947.png'],
    descAr: 'تم تصميم هذا النظام كحل رقمي متكامل لإدارة الزيارات الحقلية، يعتمد على Google Sheets كقاعدة بيانات بسيطة وخفيفة، وذلك لأن حجم المشروع صغير ولا يحتاج إلى قاعدة بيانات معقدة أو خوادم ضخمة. هذا الاختيار يضمن سرعة التطوير، وسهولة الصيانة، وانخفاض التكلفة، مع توفير جميع الوظائف المطلوبة من تخزين بيانات المزارعين والزيارات والصور بشكل مرن وآمن.',
    descEn: 'This system is designed as an integrated digital solution for managing field visits, utilizing Google Sheets as a simple and lightweight database. This choice was made because the project is small-scale and does not require a complex database or heavy servers. This approach ensures rapid development, easy maintenance, and low cost, while still providing all the required functionalities for storing farmers data, visits, and images in a flexible and secure manner.',
    tags: ['HTML', 'Node.js','CSS','JavaScript ','Google Apps Script','Google Sheets API','Google Drive API','Google Maps API']
  },
  {
    id: 4,
    nameAr: 'تطبيق الملاحظات',
    nameEn: 'My diary printer',
    url: 'proj_4/index.html',
    dateAr: 'يناير 2026',
    dateEn: 'jan 2026',
    thumb: 'pictures/pic projects/Screenshot 2026-08-01 151412.png',
    images: ['pictures/pic projects/Screenshot 2026-08-01 151424.png'],
    descAr: 'هو موقع سويته بحيث يرتب ويكون تطوير لمذكراتي اليومية الي اكتبها كل يوم بحيث منه بدل ما اكتبها يدوياً اقدر اكتبها في الصفحه بالخط الي انا ابي من بين خطوط و وواقدر اطبعها بكل سهوله a4 او a6 واقدر وحطيت نضام النقاط الي كنت احطه يدوياً ولي هو مجرد مهام يوميه اقيم فيها نفسي وايضاً امكانيه وضع التاريخ في كل صفحة وحليت المشكله الجمل الطويله التي كانت لا تكفي الصفحه كامله بحيث صار هنا إذا كتبت كلام كثير يصغر الخط في كل مذكرة',
    descEn: 'This is a website I created to organize and improve my daily journal entries. Instead of writing them by hand, I can now write them on the page in my preferred font, and easily print them in A4 or A6 format. I ve also added the point system I used to manually create, which is simply a daily task for self-assessment. Additionally, I can add the date to each page, and I solved the problem of long sentences not fitting on the entire page; now, if I write a lot, the font size decreases in each entry.',
    tags: ['JavaScript', 'HTML', 'CSS']
  },
  {
    id: 5,
    nameAr: 'المدرج',
    nameEn: 'Almudraj',
    url: 'https://m00495.github.io/Almudraj',
    dateAr: 'فبراير 2026',
    dateEn: 'feb 2026',
    descAr: 'هذا الموقع الي انت داخله وفكرته لعرض قدراتي',
    descEn: 'This is the site you are currently visiting; its concept is to showcase capabilities.',
    tags: ['html', 'css', 'js']
  },
];

// ========== اللغة الحالية ==========
let currentLang = localStorage.getItem('lang') || 'ar';

function applyLanguage(lang) {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang]?.[key]) el.textContent = i18n[lang][key];
  });
  document.getElementById('langToggle').textContent = lang === 'ar' ? 'E' : 'ع';

  // تحديث أسماء المشاريع والتواريخ في القائمة
  document.querySelectorAll('.list-item').forEach(item => {
    const projectId = parseInt(item.getAttribute('data-project-id'));
    const project = projectsData.find(p => p.id === projectId);
    if (!project) return;
    const nameEl = item.querySelector('.item-name');
    const dateEl = item.querySelector('.item-date');
    if (nameEl) nameEl.textContent = lang === 'ar' ? project.nameAr : project.nameEn;
    if (dateEl) dateEl.textContent = lang === 'ar' ? project.dateAr : project.dateEn;
  });

  // تحديث المودال إذا كان مفتوحاً
  const modalTitle = document.getElementById('modalTitle');
  if (modalTitle && modalTitle.dataset.projectId) {
    const project = projectsData.find(p => p.id == modalTitle.dataset.projectId);
    if (project) {
      document.getElementById('modalTitle').textContent = lang === 'ar' ? project.nameAr : project.nameEn;
      document.getElementById('modalDesc').textContent = lang === 'ar' ? project.descAr : project.descEn;
    }
  }
}

function switchLanguage() {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  localStorage.setItem('lang', currentLang);
  applyLanguage(currentLang);
}

// ========== المودال ==========
const pageBlur   = document.getElementById('pageBlur');
const modal      = document.getElementById('projectModal');
const modalCard  = document.getElementById('modalCard');
const modalClose = document.getElementById('modalClose');

function openModal(p) {
  document.getElementById('modalImages').innerHTML = (p.images || []).map(src => `<img src="${src}" class="modal-img" alt="${p.nameAr}">`).join('');
  document.getElementById('modalTitle').textContent = currentLang === 'ar' ? p.nameAr : p.nameEn;
  document.getElementById('modalTitle').dataset.projectId = p.id;
  document.getElementById('modalDesc').textContent = currentLang === 'ar' ? p.descAr : p.descEn;
  document.getElementById('modalTags').innerHTML = (p.tags || []).map(t => `<span class="modal-tag">${t}</span>`).join('');
  const enterBtn = document.getElementById('modalEnterBtn');
  enterBtn.onclick = () => window.open(p.url, '_blank');
  enterBtn.querySelector('span:first-child').textContent = i18n[currentLang].enterProject;

  pageBlur.classList.add('active');
  modal.classList.add('active');
  modalCard.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  pageBlur.classList.remove('active');
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
pageBlur.addEventListener('click', closeModal);
modalCard.addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ========== بناء القائمة مع دعم اللغة ==========
const scrollList = document.getElementById('scrollList');
const gradTop    = document.getElementById('gradTop');
const gradBottom = document.getElementById('gradBottom');

function buildProjectList() {
  scrollList.innerHTML = '';
  projectsData.forEach((project, index) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'list-item-wrapper';
    wrapper.innerHTML = `
      <div class="list-item" data-project-id="${project.id}">
        <div class="item-bg" style="background-image:url('${project.thumb}')"></div>
        <div class="item-overlay"></div>
        <div class="item-main">
          <span class="item-number">${String(index+1).padStart(2,'0')}</span>
          <div class="item-name-group">
            <span class="item-name">${currentLang === 'ar' ? project.nameAr : project.nameEn}</span>
            <span class="item-date" data-project-id="${project.id}">${currentLang === 'ar' ? project.dateAr : project.dateEn}</span>
          </div>
          <span class="item-link-btn" data-url="${project.url}">↗</span>
        </div>
      </div>
    `;

    const itemEl = wrapper.querySelector('.list-item');
    const linkBtn = wrapper.querySelector('.item-link-btn');

    itemEl.addEventListener('click', (e) => {
      if (e.target.classList.contains('item-link-btn')) return;
      openModal(project);
    });

    linkBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.open(project.url, '_blank');
    });

    scrollList.appendChild(wrapper);

    setTimeout(() => {
      wrapper.classList.add('in-view');
    }, index * 80);
  });
}

// ========== حركة السلسة عند النقر على الخط الزمني ==========
document.getElementById('timelineBtn').addEventListener('click', function(e) {
  e.preventDefault();
  const target = document.getElementById('projects');
  if (!target) return;
  const startY = window.scrollY;
  const endY   = target.getBoundingClientRect().top + startY - 70;
  const dist   = endY - startY;
  let t0 = null;
  const ease = t => t < 0.5 ? 8*t*t*t*t : 1-Math.pow(-2*t+2,4)/2;
  const step = ts => {
    if (!t0) t0 = ts;
    const p = Math.min((ts-t0)/1100, 1);
    window.scrollTo(0, startY + dist*ease(p));
    if (p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
});

// ========== التدرجات ==========
scrollList.addEventListener('scroll', () => {
  const { scrollTop, scrollHeight, clientHeight } = scrollList;
  gradTop.style.opacity = Math.min(scrollTop/50, 1);
  const d = scrollHeight - (scrollTop + clientHeight);
  gradBottom.style.opacity = scrollHeight <= clientHeight ? 0 : Math.min(d/50, 1);
});

// ========== بدء التشغيل ==========
document.getElementById('langToggle').addEventListener('click', switchLanguage);
applyLanguage(currentLang);
buildProjectList();
</script>
