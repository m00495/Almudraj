<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="blue.png">
<title>قائمة الأسامي</title>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --surface: #fffdf7;
    --border: #d6c9a8;
    --text: #2c2416;
    --muted: #7a6a4f;
    --accent: #5688a8;
    --accent-light: #eaf2df;
    --accent-hover: #304166;
    --maps: #1356ad;
    --maps-hover: #1558b0;
    --shadow: rgba(44, 36, 22, 0.08);
  }

  body { font-family: 'El Messiri', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0; }

  header { background: var(--accent); padding: 2rem 2rem 1.5rem; text-align: center; }
  header h1 { font-size: 1.8rem; font-weight: 600; color: #fff; letter-spacing: 0.01em; margin-bottom: 0.25rem; }
  header p  { font-size: 0.9rem; color: rgba(255,255,255,0.75); }

  .search-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.25rem 2rem; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px var(--shadow); }
  .search-inner { max-width: 720px; margin: 0 auto; position: relative; }
  .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  #searchInput {
    width: 100%; padding: 0.75rem 2.8rem 0.75rem 1rem; font-size: 1rem; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,122,58,0.15); background: #fff; }
  #searchInput::placeholder { color: var(--muted); }

  .stats { max-width: 720px; margin: 1.25rem auto 0.5rem; padding: 0 0.25rem; font-size: 0.82rem; color: var(--muted); }

  .list { max-width: 720px; margin: 0 auto; padding: 0.5rem 2rem 3rem; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; transition: box-shadow 0.18s, transform 0.18s; animation: fadeUp 0.25s ease both;
  }
  .card:hover { box-shadow: 0 4px 16px var(--shadow); transform: translateY(-1px); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .card-left { display: flex; align-items: center; gap: 0.9rem; min-width: 0; flex: 1; }
  .info { min-width: 0; }
  .name { font-size: 1rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .location { font-size: 0.82rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .location svg { vertical-align: middle; margin-left: 3px; }

  .btn-map {
    display: flex; align-items: center; gap: 6px; padding: 0.5rem 1rem;
    background: var(--maps); color: #fff; border: none; border-radius: 8px;
    font-family: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer;
    white-space: nowrap; flex-shrink: 0; transition: background 0.18s, transform 0.12s;
  }
  .btn-map:hover  { background: var(--maps-hover); }
  .btn-map:active { transform: scale(0.97); }

  .status-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 85px; padding: 0.4rem 1rem; border-radius: 20px;
    font-size: 0.85rem; font-weight: 600; cursor: default;
    transition: background 0.2s, color 0.2s, filter 0.2s; user-select: none;
  }
  .status-badge.visited     { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .status-badge.not-visited { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  body.editable .status-badge        { cursor: pointer; }
  body.editable .status-badge:hover  { filter: brightness(0.93); }

  .password-section { max-width: 720px; margin: 1.5rem auto 0; padding: 0.5rem 2rem; text-align: center; }
  .password-section input[type="password"] {
    padding: 0.5rem; font-family: inherit; font-size: 0.9rem;
    border: 1.5px solid var(--border); border-radius: 6px; width: 160px; margin-left: 0.5rem;
  }
  .password-section button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 0.5rem 1.2rem; font-family: inherit; font-size: 0.9rem; cursor: pointer; }
  .password-section button:hover { background: var(--accent-hover); }

  /* شاشة التحميل */
  .loading {
    max-width: 720px; margin: 3rem auto; text-align: center; color: var(--muted); font-size: 1rem;
  }
  .loading-spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { max-width: 720px; margin: 2rem auto; text-align: center; color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 10px; padding: 1rem 2rem; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); display: none; }
  .empty svg { display: block; margin: 0 auto 1rem; opacity: 0.35; }
  .empty p { font-size: 1rem; }

  .footer-section { max-width: 720px; margin: 0 auto 3rem; padding: 1.5rem 2rem; border-top: 1px dashed var(--border); color: var(--muted); font-size: 0.9rem; text-align: center; font-style: italic; opacity: 0.7; }

  mark { background: #fff3a3; border-radius: 3px; padding: 0 1px; color: var(--text); }

  @media (max-width: 540px) {
    header { padding: 1.5rem 1rem 1.2rem; }
    header h1 { font-size: 1.4rem; }
    .search-wrap { padding: 1rem; }
    .list { padding: 0.5rem 1rem 3rem; }
    .btn-map span { display: none; }
    .btn-map { padding: 0.5rem 0.7rem; }
    .password-section { padding: 0.5rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>دليلك للأسامي</h1>
  <p>ابحث عن راعي المزرعة وافتح موقعها بضغطة "هنا"</p>
</header>

<div class="password-section" id="passwordSection">
  <input type="password" id="empPassword" placeholder="رمز الموظفين">
  <button onclick="attemptLogin()">دخول</button>
  <span id="loginError" style="color:red; font-size:0.85rem; display:block; margin-top:5px;"></span>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="ابحث عن اسم الراعي..." autocomplete="off" />
  </div>
</div>

<div class="stats" id="stats"></div>

<!-- شاشة التحميل -->
<div class="loading" id="loadingScreen">
  <div class="loading-spinner"></div>
  <p>جاري تحميل البيانات...</p>
</div>

<!-- رسالة الخطأ -->
<div class="error-msg" id="errorMsg" style="display:none;">
  ⚠️ تعذّر الاتصال بالبيانات — تحقق من رابط الـ API أو اتصالك بالإنترنت.
</div>

<div class="list" id="list"></div>

<div class="footer-section"></div>

<div class="empty" id="empty">
  <svg width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    <line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/>
  </svg>
  <p>ما لقينا نتائج — جرب اسم ثاني</p>
</div>

<script>
// ======================================================
// ضع رابط الـ deployment هنا
const API_URL = 'https://script.google.com/macros/s/AKfycbxDTTUe0WtxyLloDP9HPYcvxrZ6D_HocsA7E1kr4zXMH1K7uH8OXGPMJoV2wR9R_R1NVQ/exec';
// ======================================================

const PASSWORD = '12345';
let isEditing = false;
let farmers   = []; // تُملأ من الشيت

// ── تسجيل الدخول ──
function attemptLogin() {
  const pw    = document.getElementById('empPassword').value;
  const error = document.getElementById('loginError');
  if (pw === PASSWORD) {
    isEditing = true;
    document.body.classList.add('editable');
    document.getElementById('passwordSection').style.display = 'none';
    error.textContent = '';
    render(document.getElementById('searchInput').value);
  } else {
    error.textContent = 'رمز خاطئ – حاول مرة أخرى.';
  }
}

async function updateVisitInSheet(farmId, visited) {
  console.log(`📤 إرسال (GET): id=${farmId}, visited=${visited}`);
  try {
    const url = `${API_URL}?id=${farmId}&visited=${visited}`;
    const response = await fetch(url);
    const result = await response.json();
    console.log('رد الخادم:', result);
    if (result.result !== 'success') throw new Error(result.message);
    
    // تحديث الواجهة محلياً
    const badge = document.querySelector(`.status-badge[data-id="${farmId}"]`);
    if (badge) {
      badge.className = `status-badge ${visited ? 'visited' : 'not-visited'}`;
      badge.textContent = visited ? 'تم الترشيد' : 'لم يتم';
    }
    const farmer = farmers.find(f => String(f.id) === String(farmId));
    if (farmer) farmer.visited = visited;
    
    console.log('✅ تم الحفظ بنجاح');
  } catch (e) {
    console.error('❌ فشل التحديث:', e);
    alert('حدث خطأ في حفظ الحالة: ' + e.message);
  }
}
// ── تمييز نص البحث ──
function highlight(text, query) {
  if (!query) return text;
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text).replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

function openMaps(lat, lng) {
  window.open(`https://www.google.com/maps?q=${lat},${lng}&z=15&hl=ar`, '_blank');
}

// ── رسم القائمة ──
function render(query) {
  const q        = query.trim();
  const filtered = q
    ? farmers.filter(f => String(f.name).includes(q))
    : farmers;

  const list  = document.getElementById('list');
  const empty = document.getElementById('empty');
  const stats = document.getElementById('stats');

  list.innerHTML = '';

  if (filtered.length === 0) {
    empty.style.display = 'block';
    stats.textContent   = '';
    return;
  }

  empty.style.display = 'none';
  stats.textContent   = `${filtered.length} من أصل ${farmers.length}`;

  filtered.forEach((f, i) => {
    const card = document.createElement('div');
    card.className         = 'card';
    card.style.animationDelay = `${i * 25}ms`;

    const visited = f.visited === true;

    card.innerHTML = `
      <div class="card-left">
        <div class="info">
          <div class="name">${highlight(f.name, q)}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <span class="status-badge ${visited ? 'visited' : 'not-visited'}" data-id="${f.id}">
          ${visited ? 'تم الترشيد' : 'لم يتم'}
        </span>
        <button class="btn-map" onclick="openMaps(${f.lat}, ${f.lng})">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span>هنا</span>
        </button>
      </div>`;

    list.appendChild(card);
  });

  // أحداث تغيير الحالة (للموظفين فقط)
  document.querySelectorAll('.status-badge').forEach(badge => {
    badge.addEventListener('click', async function () {
      if (!isEditing) return;
      const farmId     = this.dataset.id;
      const farmer     = farmers.find(f => String(f.id) === String(farmId));
      if (!farmer) return;

      const newVisited  = !farmer.visited;
      farmer.visited    = newVisited;

      this.className    = 'status-badge ' + (newVisited ? 'visited' : 'not-visited');
      this.textContent  = newVisited ? 'تم الترشيد' : 'لم يتم';

      await updateVisitInSheet(farmId, newVisited);
    });
  });
}

async function fetchAll() {
  const res = await fetch(API_URL);
  const data = await res.json();
  return data.map(item => ({
    id: item.id || item.ID,
    name: item.name,
    lat: item.lat,
    lng: item.lng,
    visited: item.visited === true || item.visited === 'TRUE' || item.visited === 'نعم'
  }));
}

// ── تشغيل الصفحة ──
(async function init() {
  try {
    farmers = await fetchAll();
    document.getElementById('loadingScreen').style.display = 'none';
    render('');
  } catch (e) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('errorMsg').style.display      = 'block';
    console.error(e);
  }

  document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));
})();
</script>
</body>
</html>
